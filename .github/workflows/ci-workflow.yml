name: CI workflow

on:
  push:
  pull_request:

jobs:
  simple_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run cicd_simple_commit suite
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/cicd_simple_commit.xml

      - name: Run UI smoke suite (headless)
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/ui_smoke.xml -Dheadless=true

      - name: Run PR-only suite
        if: github.event_name == 'pull_request'
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/cicd_syntetic_tests.xml

      - name: Run UI regression suite (headless)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/ui_regression.xml -Dheadless=true

      # Report and upload run even when a test step failed; the job still fails on test failures.
      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-simple_check
          path: allure-report
          retention-days: 2

  bdd:
    # Same events as the regression steps: pull requests and merges to master, not plain pushes.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run BDD suite (headless)
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/bdd.xml -Dheadless=true

      # Report and upload run even when a test step failed; the job still fails on test failures.
      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-bdd
          path: allure-report
          retention-days: 2
