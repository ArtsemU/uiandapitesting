name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run cicd_simple_commit suite
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/cicd_simple_commit.xml

      - name: Run PR-only suite
        if: github.event_name == 'pull_request'
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/<твой_второй_файл>.xml