name: Nightly full regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  full_regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run UI regression suite (headless)
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/ui_regression.xml -Dheadless=true

      - name: Run API parallel testing suite
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/api-parallel-testng.xml

      - name: Run API parallel testing suite with catalogue stubs (WireMock + Mockito)
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/api-parallel-testng.xml -Dstub.catalogue.wiremock=true -Dstub.catalogue.mockito=true

      - name: Run BDD parallel suite (headless)
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suite/bdd_parallel.xml -Dheadless=true

      # Report and upload run even when a test step failed; the job still fails on test failures.
      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-full_regression
          path: allure-report
          retention-days: 2
